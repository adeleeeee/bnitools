# BNI 25 秒會員簡報：週二替換、週三清理。程式說明見 tools/bni25s.py。
#
# 🔴 公開 repo：這裡的執行紀錄任何人都看得到。
#    程式只印會員編號；資料夾 ID、授權全部放 Secrets（GitHub 會把 secret 值遮成 ***）。
#
# 需要的 Repository secrets（Settings → Secrets and variables → Actions）：
#   GDRIVE_CLIENT_ID / GDRIVE_CLIENT_SECRET / GDRIVE_REFRESH_TOKEN   Google 授權（使用者自己設定）
#   BNI25S_PPT_FOLDER_ID       主檔 BNI25S-YYYYMMDD 所在資料夾 ID
#   BNI25S_UPLOAD_FOLDER_ID    會員上傳資料夾 ID
name: BNI 25 秒簡報

on:
  schedule:
    - cron: "7 7 * * 2"    # 週二 15:07（台灣）替換簡報；避開整點，GitHub 排程整點最塞
    - cron: "30 16 * * 2"  # 週三 00:30（台灣）清理上傳區
  workflow_dispatch:
    inputs:
      mode:
        description: "update＝替換簡報，cleanup＝清理上傳區"
        type: choice
        options: [update, cleanup]
        default: update
      dry_run:
        description: "只檢查、不寫入 Drive"
        type: boolean
        default: true
      overwrite:
        description: "（update）本週檔已存在時就地覆蓋"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bni25s
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install python-pptx==1.0.2 google-api-python-client==2.201.0 google-auth==2.62.0

      - name: 寫入私有設定（值來自 Secrets，不印出）
        env:
          PPT_FOLDER: ${{ secrets.BNI25S_PPT_FOLDER_ID }}
          UPLOAD_FOLDER: ${{ secrets.BNI25S_UPLOAD_FOLDER_ID }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = {
              "schema_version": 1,
              "timezone": "Asia/Taipei",
              "slides25s_ppt_folder_id": os.environ["PPT_FOLDER"],
              "slides25s_upload_folder_id": os.environ["UPLOAD_FOLDER"],
          }
          with open("config.json", "w", encoding="utf-8") as fh:
              json.dump(cfg, fh, ensure_ascii=False)
          EOF
          python3 tools/bni_config.py --flow bni25s

      - name: 執行
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          args=()
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "7 7 * * 2")   mode=update ;;
              "30 16 * * 2") mode=cleanup ;;
              *) echo "未知的排程：$SCHEDULE" >&2; exit 1 ;;
            esac
          else
            mode="$MODE"
            [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
            [ "$OVERWRITE" = "true" ] && [ "$mode" = "update" ] && args+=(--overwrite)
          fi
          echo "模式：$mode ${args[*]}"
          python3 tools/bni25s.py "$mode" "${args[@]}"
